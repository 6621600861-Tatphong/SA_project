<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h2>Login</h2>

    <form id="loginForm">

        <input type="text" id="username" placeholder="Username" required>
        <br><br>

        <input type="password" id="password" placeholder="Password" maxlength="7" required>
        <br><br>

        <button type="submit">Login</button>

    </form>

    <p id="result"></p>

    <p>
        ยังไม่มีบัญชี ?
        <a href="register.html">สมัครสมาชิก</a>
    </p>

    <script src="../js/login_register.js"></script>

</body>

</html>
