<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body>

    <h2>Register</h2>

    <form id="registerForm">

        <input type="text" id="username" placeholder="Username" required>
        <br><br>

        <input type="password" id="password" placeholder="Password" maxlength="7" required>
        <br><br>

        <input type="text" id="phone" placeholder="Phone" maxlength="10" required>
        <br><br>

        <input type="email" id="email" placeholder="Email" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

    <p id="result"></p>

    <p>
        มีบัญชีแล้ว ?
        <a href="login.html">กลับไป Login</a>
    </p>

    <script src="../js/login_register.js"></script>

</body>

</html>
